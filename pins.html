<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pins</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
<style>
  .pins { columns: 3 200px; column-gap: 1rem; }
  .pins img {
    width: 100%; display: block; margin: 0 0 1rem;
    border-radius: 16px; border: 3px solid #fff;
    box-sizing: border-box; break-inside: avoid;
    transition: transform .2s;
  }
  .pins img:hover { transform: scale(1.03) rotate(-.5deg); }
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Home</a>
<main>
<h1>Pins that feel like me</h1>
<p>This only a part of my world who i am now. it can change . </p>
<div class="pins shuffle">
  <img src="images/8.jpeg" alt="Pin 1">
  <img src="images/9.jpeg" alt="Pin 2">
  <img src="images/10.jpeg" alt="Pin 3">
  <img src="images/11.jpeg" alt="Pin 4">
  <img src="images/12.jpeg" alt="Pin 5">
  <img src="images/13.jpeg" alt="Pin 6">
  <img src="images/14.jpeg" alt="Pin 7">
  <img src="images/15.jpeg" alt="Pin 8">
</div>
<p style="font-size:.9rem">Images are saved Pinterest pins and belong to their original creators.</p>
</main>
</body>
</html>
