    <div id="map"></div>
    <div id="olmap"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const harita = L.map('map',{
             minZoom : 1,
             maxBounds: [[-90, -180] ,[90, 180]],
             maxBoundsViscosity: 1.0
         }).setView([39.0, 35.0], 5);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',noWrap : true
        }).addTo(harita);

        L.marker([39.93, 32.86]).addTo(harita).bindPopup('Ankara');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>
    <script>
    const olHarita = new ol.Map({
        target: 'olmap',
        layers: [
            new ol.layer.Tile({
                source: new ol.source.OSM({ wrapX: false })
            })
        ],
        view: new ol.View({
            center: ol.proj.fromLonLat([35,39]),
            zoom: 7,
            minZoom: 0,
             extent: ol.proj.transformExtent([-180, -85, 180, 85], 'EPSG:4326', 'EPSG:3857')
        })
    });
    </script>
